name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

# Default: read-only. Hosted PR gates must stay contents:read and must never
# interpolate TAURI_SIGNING_PRIVATE_KEY, MEOWWATCH_RELEASE_KEY / the Ed25519
# seed / release-key.txt, or R2_* secrets. The tag-only
# `build-windows-x64` job grants `contents: write` to create GitHub Releases.
permissions:
  contents: read

# PR/branch runs: per-ref group, cancel superseded runs.
# Tag runs: one shared group so releases queue (never cancel) and never race
# on the shared R2 keys (latest.json / changelog.json).
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}-release', github.workflow) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Analyze + test ────────────────────────────────────────────────────
  # Every `pull_request` takes GitHub-hosted `check-hosted` (`windows-2022`).
  # That is the only PR path. `gate` stays the required check name
  # (`Analyze & Test`).
  #
  # The self-hosted host holds the release-signing seed, so pull-request
  # code must never schedule there — including trusted-admin same-repo PRs.
  # Fork-workflow approval does not cover a future write login adding a
  # new workflow, so remaining self-hosted jobs keep a YAML `if:` allowlist
  # `{PeterShanxin, ianmeowmeow}` and exclude Dependabot.
  # `check-self-hosted` is push/tag analyze only (trusted-admin actor).
  # Tag sign stays on `build-windows-x64` (same allowlist).
  #
  # Keep self-hosted jobs free of hosted-only composite actions:
  # self-hosted runners prepare composite action dependencies before
  # skipped steps are evaluated, so a `subosito/flutter-action` step here
  # would try to set up (and fail) even when skipped — that's why hosted
  # is a separate job.
  #
  # The suite is NOT cross-platform — `test/core/video/video_url_test.dart`
  # asserts on Windows paths (`C:\…` → basename) and
  # `test/ui/chat/chat_overlay_golden_test.dart` uses Windows-rendered goldens —
  # so on Linux 4 tests fail; both paths below must run on Windows.

  check-self-hosted:
    name: Analyze & Test (self-hosted)
    # Push/tag only. Never pull_request. Write access is not host trust.
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        contains(fromJSON('["PeterShanxin","ianmeowmeow"]'), github.actor) &&
        github.actor != 'dependabot[bot]'
      }}
    runs-on: [self-hosted, windows, meowwatch-ci]
    # Bound runaway hangs: the suite normally finishes in ~5m, but a stuck
    # flutter_tester otherwise sits until GitHub's 6h default, wedging the
    # self-hosted runner. See docs/AGENT_GUIDE.md → CI (runner hangs).
    timeout-minutes: 20
    steps:
      # Belt-and-braces: the job `if` should already exclude these. Fail closed
      # if a future edit lets a PR, Dependabot, or any other login reach this
      # host. github.actor is required on every event.
      - name: Refuse untrusted workflow actors
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($env:EVENT_NAME -eq 'pull_request') {
            Write-Error "pull_request must never run on the self-hosted runner (actor=$($env:ACTOR))."
            exit 1
          }
          if ($env:ACTOR -eq 'dependabot[bot]') {
            Write-Error "Dependabot must never run on the self-hosted runner."
            exit 1
          }
          if ($trusted -notcontains $env:ACTOR) {
            Write-Error "Only PeterShanxin or ianmeowmeow may run on the self-hosted runner (actor=$($env:ACTOR) event=$($env:EVENT_NAME))."
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Setup Flutter (self-hosted, pre-installed via Puro)
        shell: pwsh
        run: |
          $flutterBin = Join-Path $env:USERPROFILE '.puro\envs\stable\flutter\bin'
          if (-not (Test-Path (Join-Path $flutterBin 'flutter.bat'))) {
            Write-Error "Flutter not found at $flutterBin — is Puro's stable env installed on the runner?"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "Using pre-installed Flutter at $flutterBin"

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

  # Every pull_request. Standard GitHub-hosted `windows-2022`. Forks,
  # Dependabot, trusted-admin same-repo PRs, and any other login all take
  # this path. Pinned to 2022 (not 2025): hosted 2025 failed the two
  # chat-overlay goldens (run 33264970792: 0.05%/444px and 15px). That
  # image already ran untrusted PRs. Do not --update-goldens for 2025
  # pixels. Trusted-admin push/tag stay on check-self-hosted. This job
  # must not interpolate TAURI_SIGNING_PRIVATE_KEY, MEOWWATCH_RELEASE_KEY,
  # or R2_* secrets.
  check-hosted:
    name: Analyze & Test (hosted)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 25 # bound hangs; hosted run normally ~12-15m
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Hosted runners download Flutter fresh.
      - name: Setup Flutter (hosted)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # caches both the Flutter SDK and pub dependencies

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

  # Required check (the merge gate). Cheap hosted-Linux referee that
  # passes iff `check-hosted` went green. Branch protection should require
  # THIS context — `Analyze & Test` — and nothing else. PR-only — plain
  # pushes and tags don't gate-merge. Must not interpolate signing/R2/
  # mirror secrets.
  gate:
    name: Analyze & Test
    needs: [check-hosted]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Require a green Analyze & Test
        shell: bash
        run: |
          ho='${{ needs.check-hosted.result }}'
          echo "hosted=$ho"
          if [ "$ho" = "success" ]; then
            echo "Analyze & Test passed."
            exit 0
          fi
          echo "::error::No green Analyze & Test run (hosted=$ho). Every pull_request uses GitHub-hosted Windows — a red or skipped hosted job is a real failure."
          exit 1

  # ── Build Windows x64 (tag pushes only — release builds anyway) ────
  build-windows-x64:
    name: Windows x64
    needs: [check-self-hosted]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && contains(fromJSON('["PeterShanxin","ianmeowmeow"]'), github.actor) && github.actor != 'dependabot[bot]' && needs.check-self-hosted.result == 'success' }}
    permissions:
      contents: write # Create GitHub Release + upload zip/sig (tag-only).
    # Runs on a self-hosted Windows runner (our own PC) so the expensive 2×
    # Windows build consumes no GitHub-hosted minutes. Requires a runner
    # registered with the `self-hosted` + `windows` + `meowwatch-ci` labels and
    # the Visual Studio desktop C++ toolchain installed (see
    # docs/AGENT_GUIDE.md → CI). github.actor must be PeterShanxin or
    # ianmeowmeow — any other login's v* tag must not build or sign here.
    # pull_request never reaches this job. Falls back to nothing if no runner is
    # online — the job queues until one is.
    runs-on: [self-hosted, windows, meowwatch-ci]
    # Bound runaway hangs/builds: a release build is normally ~18m.
    timeout-minutes: 45
    steps:
      # Belt-and-braces with the job `if`: any other login's v* tag must
      # never checkout or sign on this host.
      - name: Refuse untrusted workflow actors
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
        run: |
          $trusted = @('PeterShanxin', 'ianmeowmeow')
          if ($env:ACTOR -eq 'dependabot[bot]') {
            Write-Error "Dependabot must never run tag signing on the self-hosted runner."
            exit 1
          }
          if ($trusted -notcontains $env:ACTOR) {
            Write-Error "Only PeterShanxin or ianmeowmeow may run tag signing on the self-hosted runner (actor=$($env:ACTOR))."
            exit 1
          }

      - uses: actions/checkout@v7

      - name: Setup Flutter (self-hosted, pre-installed via Puro)
        shell: pwsh
        run: |
          $flutterBin = Join-Path $env:USERPROFILE '.puro\envs\stable\flutter\bin'
          if (-not (Test-Path (Join-Path $flutterBin 'flutter.bat'))) {
            Write-Error "Flutter not found at $flutterBin — is Puro's stable env installed on the runner?"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "Using pre-installed Flutter at $flutterBin"

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package release
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "MeowWatch-windows-x64.zip" -Force

      # Authenticity: sign the zip with the Ed25519 release key that lives ONLY
      # on this PC (never in the repo, GitHub secrets, or R2). The app verifies
      # this signature against its baked-in public key before installing, so a
      # poisoned bucket can't forge an update. Fail-closed: no key => no release,
      # because shipping an unsigned build would brick every install's updater.
      # See docs/AGENT_GUIDE.md -> Release signing.
      - name: Sign release
        shell: pwsh
        env:
          # Set the repo/workflow variable MEOWWATCH_ALLOW_KEY_MISMATCH to 'true'
          # for a single key-rotation transitional release (baking the NEW public
          # key while the runner still holds the OLD seed) — then clear it. Empty
          # on normal releases. See docs/AGENT_GUIDE.md -> Release signing.
          MEOWWATCH_ALLOW_KEY_MISMATCH: ${{ vars.MEOWWATCH_ALLOW_KEY_MISMATCH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = if ($env:MEOWWATCH_RELEASE_KEY) {
            $env:MEOWWATCH_RELEASE_KEY
          } else {
            Join-Path $env:USERPROFILE '.meowwatch\release-key.txt'
          }
          if (-not (Test-Path $keyPath)) {
            Write-Error "Release signing key not found at $keyPath. A release must be signed (fail-closed). Place the private seed on this runner, or set MEOWWATCH_RELEASE_KEY to its path. See docs/AGENT_GUIDE.md -> Release signing."
            exit 1
          }
          # The signature binds the version, so sign with the tag's version
          # (matches the "version" the R2 job writes into latest.json).
          $version = ($env:GITHUB_REF -replace '^refs/tags/v', '')
          $signArgs = @('run', 'tool/release_signer.dart', 'sign', '--version', $version)
          if ($env:MEOWWATCH_ALLOW_KEY_MISMATCH -in @('1', 'true', 'TRUE', 'True')) {
            Write-Host 'MEOWWATCH_ALLOW_KEY_MISMATCH set -> signing with --allow-key-mismatch (key-rotation transitional release).'
            $signArgs += '--allow-key-mismatch'
          }
          $signArgs += @("$keyPath", 'MeowWatch-windows-x64.zip', 'MeowWatch-windows-x64.zip.sig')
          & dart @signArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Signing failed (exit $LASTEXITCODE)"
            exit 1
          }
          if (-not (Test-Path 'MeowWatch-windows-x64.zip.sig')) {
            Write-Error "Signing produced no .sig file"
            exit 1
          }
          Write-Host "Signed release v$version; sig bytes: $((Get-Item 'MeowWatch-windows-x64.zip.sig').Length)"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          $repo = $env:GITHUB_REPOSITORY
          # Upload the zip AND its detached signature so the R2 publish job can
          # embed the sig into latest.json.
          $assetNames = @('MeowWatch-windows-x64.zip', 'MeowWatch-windows-x64.zip.sig')
          $contentTypes = @{
            'MeowWatch-windows-x64.zip'     = 'application/zip'
            'MeowWatch-windows-x64.zip.sig' = 'text/plain'
          }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $release = $null
          try {
            $release = Invoke-RestMethod `
              -Method Get `
              -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" `
              -Headers $headers
          } catch {
            $statusCode = if ($_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            } else {
              0
            }
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($null -eq $release) {
            $body = @{
              tag_name = $tag
              name = $tag
              draft = $false
              prerelease = $tag -match '-(alpha|beta|rc)'
              generate_release_notes = $true
            } | ConvertTo-Json
            $release = Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$repo/releases" `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body
          }

          foreach ($asset in @($release.assets)) {
            if ($assetNames -contains $asset.name) {
              try {
                Invoke-RestMethod `
                  -Method Delete `
                  -Uri "https://api.github.com/repos/$repo/releases/assets/$($asset.id)" `
                  -Headers $headers
              } catch {
                Write-Host "Warning: could not delete existing asset $($asset.id): $($_.Exception.Message)"
              }
            }
          }
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($name in $assetNames) {
            Invoke-RestMethod `
              -Method Post `
              -Uri "${uploadUrl}?name=$name" `
              -Headers $headers `
              -ContentType $contentTypes[$name] `
              -InFile $name
          }

  # ── Create GitHub Release (tag pushes only) ────────────────────────
  release:
    name: Publish R2 Metadata
    needs: [build-windows-x64]
    # build-windows-x64 uses always() so a skipped check-self-hosted (wrong
    # actor) does not silently drop the result check. That skip can propagate
    # through `needs`, so a plain `if` here lets the implicit success() gate
    # skip R2 even when the build succeeded. Guard with always() + an explicit
    # result check so R2 publishes whenever the build is green.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows-x64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bound hangs; R2 publish normally ~3m
    steps:
      - uses: actions/checkout@v7

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p artifacts
          gh release download "$TAG" \
            --pattern 'MeowWatch-windows-x64.zip*' \
            --dir artifacts

      - name: Locate release zip
        id: zip
        run: |
          set -euo pipefail
          ZIP=$(find artifacts -type f -name 'MeowWatch-windows-x64.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::MeowWatch-windows-x64.zip not found under artifacts/"
            find artifacts -maxdepth 3 -print
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved release zip: $ZIP"
          # The detached signature must be present — a release with no sig would
          # be refused by every install's updater (fail-closed).
          SIG=$(find artifacts -type f -name 'MeowWatch-windows-x64.zip.sig' | head -n1)
          if [ -z "$SIG" ]; then
            echo "::error::MeowWatch-windows-x64.zip.sig not found — release must be signed."
            find artifacts -maxdepth 3 -print
            exit 1
          fi
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "Resolved signature: $SIG"

      # ── Upload to Cloudflare R2 ──
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload to R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          rclone copy "${{ steps.zip.outputs.path }}" \
            r2:${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/
          rclone copy "${{ steps.zip.outputs.sig }}" \
            r2:${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/

      - name: Update latest.json on R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SHA=$(sha256sum "${{ steps.zip.outputs.path }}" | cut -d' ' -f1)
          # Base64 Ed25519 signature over the zip bytes; the app verifies this
          # against its baked-in public key before installing (fail-closed).
          SIG=$(cat "${{ steps.zip.outputs.sig }}")
          if [ -z "$SIG" ]; then
            echo "::error::signature file is empty — refusing to publish an unverifiable release."
            exit 1
          fi
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "release_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "windows-x64": {
                "url": "${{ secrets.R2_PUBLIC_URL }}/releases/$TAG/MeowWatch-windows-x64.zip",
                "sha256": "$SHA",
                "sig": "$SIG"
              }
            },
            "release_notes": "Release $TAG"
          }
          EOF
          rclone copyto latest.json r2:${{ secrets.R2_BUCKET_NAME }}/releases/latest.json

      - name: Publish changelog to R2
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          path = pathlib.Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          header = re.compile(r'^## \[(?P<v>[^\]]+)\]\s*-\s*(?P<d>.+)$')
          entries = []
          cur = None
          for line in text.splitlines():
              mobj = header.match(line.strip())
              if mobj:
                  if cur:
                      entries.append(cur)
                  cur = {'version': mobj.group('v').strip(),
                         'date': mobj.group('d').strip(), 'notes': ''}
              elif cur is not None:
                  cur['notes'] += line + '\n'
          if cur:
              entries.append(cur)
          for e in entries:
              e['notes'] = e['notes'].strip()
          pathlib.Path('changelog.json').write_text(
              json.dumps(entries, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'{len(entries)} changelog entries')
          PY
          rclone copyto changelog.json r2:${{ secrets.R2_BUCKET_NAME }}/releases/changelog.json
