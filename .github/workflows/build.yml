name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: write # needed for creating releases

# PR/branch runs: per-ref group, cancel superseded runs.
# Tag runs: one shared group so releases queue (never cancel) and never race
# on the shared R2 keys (latest.json / changelog.json).
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}-release', github.workflow) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Fast gate: analyze + test (every PR / main push / tag) ─────────
  check-hosted:
    name: Analyze & Test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # The suite is NOT cross-platform: it has Windows-path assertions
    # (test/core/video/video_url_test.dart expects a C:\... path to basename) and
    # Windows-rendered golden images (test/ui/chat/chat_overlay_golden_test.dart),
    # so analyze+test must run on Windows — on Linux those 4 tests fail.
    # PR / branch / main pushes use hosted `windows-2022`.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # Hosted runners (PR / main / branch) download Flutter fresh.
      - name: Setup Flutter (hosted)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # caches both the Flutter SDK and pub dependencies

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

  check-self-hosted:
    name: Analyze & Test (tag)
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Tag pushes use the self-hosted runner so releases remain independent of
    # hosted Windows availability. Keep this job free of hosted-only composite
    # actions: self-hosted runners prepare composite action dependencies before
    # skipped steps are evaluated, so a skipped hosted Flutter action can still
    # fail a tag release during action download/setup.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter (self-hosted, pre-installed via Puro)
        shell: pwsh
        run: |
          $flutterBin = Join-Path $env:USERPROFILE '.puro\envs\stable\flutter\bin'
          if (-not (Test-Path (Join-Path $flutterBin 'flutter.bat'))) {
            Write-Error "Flutter not found at $flutterBin — is Puro's stable env installed on the runner?"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "Using pre-installed Flutter at $flutterBin"

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run tests
        shell: pwsh
        run: flutter test

  # ── Build Windows x64 (tag pushes only — release builds anyway) ────
  build-windows-x64:
    name: Windows x64
    needs: [check-hosted, check-self-hosted]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.check-self-hosted.result == 'success' }}
    # Runs on a self-hosted Windows runner (our own PC) so the expensive 2×
    # Windows build consumes no GitHub-hosted minutes. Requires a runner
    # registered with the `self-hosted` + `windows` labels and the Visual Studio
    # desktop C++ toolchain installed (see docs/AGENT_GUIDE.md → CI). Falls back
    # to nothing if no runner is online — the job queues until one is.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter (self-hosted, pre-installed via Puro)
        shell: pwsh
        run: |
          $flutterBin = Join-Path $env:USERPROFILE '.puro\envs\stable\flutter\bin'
          if (-not (Test-Path (Join-Path $flutterBin 'flutter.bat'))) {
            Write-Error "Flutter not found at $flutterBin — is Puro's stable env installed on the runner?"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin
          Write-Host "Using pre-installed Flutter at $flutterBin"

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Package release
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "MeowWatch-windows-x64.zip" -Force

      # Keep the artifact name and upload-artifact version in sync with
      # package-check.yml's PR-time artifact round-trip smoke test.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MeowWatch-windows-x64
          path: MeowWatch-windows-x64.zip
          retention-days: 30

  # ── Create GitHub Release (tag pushes only) ────────────────────────
  release:
    name: Create Release
    needs: [build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep the download-artifact version, merge-multiple layout, and locate
      # guard in sync with package-check.yml's PR-time smoke test.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Flatten into artifacts/ (no per-artifact subdir). download-artifact
          # changed its default nesting across majors, so don't hardcode a layout
          # — resolve the zip's real path in the next step instead.
          merge-multiple: true

      - name: Locate release zip
        id: zip
        run: |
          set -euo pipefail
          ZIP=$(find artifacts -type f -name 'MeowWatch-windows-x64.zip' | head -n1)
          if [ -z "$ZIP" ]; then
            echo "::error::MeowWatch-windows-x64.zip not found under artifacts/"
            find artifacts -maxdepth 3 -print
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved release zip: $ZIP"

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          # Fail loudly if the asset is missing instead of publishing an empty
          # release (a silent glob-miss once shipped an assetless release).
          fail_on_unmatched_files: true
          files: |
            ${{ steps.zip.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload to Cloudflare R2 ──
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          no_check_bucket = true
          EOF

      - name: Upload to R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          rclone copy "${{ steps.zip.outputs.path }}" \
            r2:${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/

      - name: Update latest.json on R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SHA=$(sha256sum "${{ steps.zip.outputs.path }}" | cut -d' ' -f1)
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "release_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "windows-x64": {
                "url": "${{ secrets.R2_PUBLIC_URL }}/releases/$TAG/MeowWatch-windows-x64.zip",
                "sha256": "$SHA"
              }
            },
            "release_notes": "Release $TAG"
          }
          EOF
          rclone copyto latest.json r2:${{ secrets.R2_BUCKET_NAME }}/releases/latest.json

      - name: Publish changelog to R2
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          path = pathlib.Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8') if path.exists() else ''
          header = re.compile(r'^## \[(?P<v>[^\]]+)\]\s*-\s*(?P<d>.+)$')
          entries = []
          cur = None
          for line in text.splitlines():
              mobj = header.match(line.strip())
              if mobj:
                  if cur:
                      entries.append(cur)
                  cur = {'version': mobj.group('v').strip(),
                         'date': mobj.group('d').strip(), 'notes': ''}
              elif cur is not None:
                  cur['notes'] += line + '\n'
          if cur:
              entries.append(cur)
          for e in entries:
              e['notes'] = e['notes'].strip()
          pathlib.Path('changelog.json').write_text(
              json.dumps(entries, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'{len(entries)} changelog entries')
          PY
          rclone copyto changelog.json r2:${{ secrets.R2_BUCKET_NAME }}/releases/changelog.json
