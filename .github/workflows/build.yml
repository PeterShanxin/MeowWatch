name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # needed for creating releases

jobs:
  # ── Build Windows x64 ─────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "MeowWatch-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowWatch-windows-x64
          path: MeowWatch-windows-x64.zip
          retention-days: 30

  # ── Create GitHub Release (tag pushes only) ────────────────────────
  release:
    name: Create Release
    needs: [build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            artifacts/MeowWatch-windows-x64/MeowWatch-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload to Cloudflare R2 ──
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          acl = private
          EOF

      - name: Upload to R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          rclone copy artifacts/MeowWatch-windows-x64/MeowWatch-windows-x64.zip \
            r2:${{ secrets.R2_BUCKET_NAME }}/releases/$TAG/

      - name: Update latest.json on R2
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SHA=$(sha256sum artifacts/MeowWatch-windows-x64/MeowWatch-windows-x64.zip | cut -d' ' -f1)
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "release_date": "$(date -u +%Y-%m-%d)",
            "assets": {
              "windows-x64": {
                "url": "${{ secrets.R2_PUBLIC_URL }}/releases/$TAG/MeowWatch-windows-x64.zip",
                "sha256": "$SHA"
              }
            },
            "release_notes": "Release $TAG"
          }
          EOF
          rclone copyto latest.json r2:${{ secrets.R2_BUCKET_NAME }}/releases/latest.json
