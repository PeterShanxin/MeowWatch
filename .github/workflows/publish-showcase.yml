name: Publish Showcase

# Mirrors a tagged release from the private MeowWatch repository to the public
# MeowWatch-releases showcase repo and refreshes allowlisted showcase files.
#
# SECURITY: Only files exported by scripts/export-showcase-bundle.mjs (driven by
# showcase/EXPORT_ALLOWLIST.json) may cross into the public repository.
#
# Write access is not host trust. This job holds RELEASE_MIRROR_TOKEN.
# Trusted co-admins PeterShanxin and ianmeowmeow may dispatch it. Forks,
# Dependabot, and any other login must not. GitHub evaluates `if:` before
# the job starts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag without v prefix, e.g. 0.47.0-alpha
        required: true
        type: string

permissions:
  contents: read

env:
  MIRROR_REPO: PeterShanxin/MeowWatch-releases

jobs:
  publish:
    name: Publish showcase and release mirror
    if: >-
      contains(fromJSON('["PeterShanxin","ianmeowmeow"]'), github.actor) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,prerelease)
          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r .isDraft)
          if [ "$IS_DRAFT" = "true" ]; then
            echo "Release $TAG is still a draft" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RELEASE_JSON" | jq -r .prerelease)" >> "$GITHUB_OUTPUT"

      - name: Build showcase bundle
        run: node scripts/export-showcase-bundle.mjs --version "${{ inputs.version }}"

      - name: Download private release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p mirror-assets
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'MeowWatch-windows-x64.zip*' \
            --dir mirror-assets

      - name: Create or update public mirror release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          if [ -z "${GH_TOKEN:-}" ]; then echo "RELEASE_MIRROR_TOKEN not set" >&2; exit 1; fi

          NOTES_FILE=$(mktemp)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$NOTES_FILE"

          PRERELEASE_FLAG=""
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists on mirror; updating assets and notes"
            gh release upload "$TAG" mirror-assets/* --repo "$MIRROR_REPO" --clobber
            gh release edit "$TAG" --repo "$MIRROR_REPO" --notes-file "$NOTES_FILE" $PRERELEASE_FLAG
          else
            gh release create "$TAG" mirror-assets/* \
              --repo "$MIRROR_REPO" \
              --title "MeowWatch $TAG" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG
          fi

      - name: Publish showcase to mirror main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "RELEASE_MIRROR_TOKEN not set" >&2; exit 1; fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPO}.git" mirror-repo
          cd mirror-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rsync -a --delete ../showcase-out/ ./
          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "docs: refresh showcase for ${{ steps.release.outputs.tag }}"
            git push origin main
          else
            echo "Showcase unchanged; skipping main-branch commit."
          fi
