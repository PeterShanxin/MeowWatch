<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="MeowWatch architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1027"/>
      <stop offset="100%" stop-color="#2d1b3d"/>
    </linearGradient>
    <style>
      .box { fill:#2d1b3d; stroke:#c084fc; stroke-width:2; rx:10; }
      .arrow { stroke:#d8b4fe; stroke-width:2; fill:none; marker-end:url(#head); }
      .label { fill:#f3e8ff; font:600 13px 'Segoe UI', system-ui, sans-serif; }
      .sub { fill:#d8b4fe; font:11px 'Segoe UI', system-ui, sans-serif; }
    </style>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d8b4fe"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="url(#bg)" rx="12"/>
  <text x="24" y="34" class="label" font-size="16">MeowWatch — co-watch architecture</text>
  <g transform="translate(24 58)">
    <rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">Flutter UI</text><text x="60" y="42" text-anchor="middle" class="sub">lobby + room</text>
    <line class="arrow" x1="120" y1="28" x2="144" y2="28"/>
    <g transform="translate(144 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">VideoCore</text><text x="60" y="42" text-anchor="middle" class="sub">libmpv</text></g>
    <line class="arrow" x1="264" y1="28" x2="288" y2="28"/>
    <g transform="translate(288 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">SyncCore</text><text x="60" y="42" text-anchor="middle" class="sub">Syncplay</text></g>
    <line class="arrow" x1="408" y1="28" x2="432" y2="28"/>
    <g transform="translate(432 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">ChatStore</text><text x="60" y="42" text-anchor="middle" class="sub">overlay</text></g>
    <line class="arrow" x1="552" y1="28" x2="576" y2="28"/>
    <g transform="translate(576 0)"><rect class="box" width="120" height="56"/><text x="60" y="24" text-anchor="middle" class="label">SQLite</text><text x="60" y="42" text-anchor="middle" class="sub">Drift</text></g>
    <line class="arrow" x1="696" y1="28" x2="720" y2="28"/>
    <g transform="translate(720 0)"><rect class="box" width="132" height="56"/><text x="66" y="24" text-anchor="middle" class="label">Updater</text><text x="66" y="42" text-anchor="middle" class="sub">Ed25519 verify</text></g>
  </g>
  <text x="24" y="190" class="sub">Playback commands flow out; sync state and chat stream back in. All logic stays on the desktop.</text>
</svg>
